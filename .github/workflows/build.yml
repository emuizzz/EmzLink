name: Build EmzLink

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri

      - name: Build
        working-directory: source/src-tauri
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          robocopy . dist/EmzLink /E /XD source installer .github .git dist /XF EmzLink.exe .gitignore | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          Copy-Item source/src-tauri/target/release/emzlink.exe dist/EmzLink/EmzLink.exe
          Compress-Archive -Path dist/EmzLink -DestinationPath EmzLink.zip
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: EmzLink
          path: EmzLink.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EmzLink.zip
